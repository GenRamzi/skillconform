name: Release SkillConform

on:
  push:
    branches: [main]
    paths:
      - package.json
      - package-lock.json
      - CHANGELOG.md
      - .github/workflows/release.yml
  workflow_dispatch:

permissions:
  contents: write
  id-token: write

concurrency:
  group: release-skillconform
  cancel-in-progress: false

jobs:
  publish:
    name: Publish version and create release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v6
        with:
          node-version: 20
          registry-url: https://registry.npmjs.org
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Validate release
        run: |
          npm run check
          npm test
          npm run test:self
          node dist/src/cli.js audit skills --fail-on warning
          npm pack --dry-run

      - name: Read package metadata
        id: package
        shell: bash
        run: |
          node <<'NODE' >> "$GITHUB_OUTPUT"
          const fs = require('node:fs');
          const pkg = JSON.parse(fs.readFileSync('package.json', 'utf8'));
          console.log(`name=${pkg.name}`);
          console.log(`version=${pkg.version}`);
          NODE

      - name: Check npm registry
        id: npm
        shell: bash
        run: |
          if npm view "${{ steps.package.outputs.name }}@${{ steps.package.outputs.version }}" version >/dev/null 2>&1; then
            echo "published=true" >> "$GITHUB_OUTPUT"
          else
            echo "published=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Publish to npm
        if: steps.npm.outputs.published != 'true'
        run: npm publish --access public --provenance
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: Check GitHub release
        id: release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "v${{ steps.package.outputs.version }}" >/dev/null 2>&1; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Create GitHub release
        if: steps.release.outputs.exists != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "v${{ steps.package.outputs.version }}" \
            --target "$GITHUB_SHA" \
            --title "SkillConform v${{ steps.package.outputs.version }}" \
            --generate-notes

      - name: Publish summary
        run: |
          {
            echo "## SkillConform v${{ steps.package.outputs.version }}"
            echo
            echo "- npm: https://www.npmjs.com/package/${{ steps.package.outputs.name }}"
            echo "- GitHub release: https://github.com/${{ github.repository }}/releases/tag/v${{ steps.package.outputs.version }}"
          } >> "$GITHUB_STEP_SUMMARY"
